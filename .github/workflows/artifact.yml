name: Artifact Practice

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create a simple file
        run: |
          mkdir output
          echo "Hello from GitHub Actions Artifact!" > output/message.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: output/

  download:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact
          path: downloaded-output/

      - name: Check downloaded files
        run: |
          ls -la downloaded-output/
          cat downloaded-output/message.txt