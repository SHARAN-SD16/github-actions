name: Advanced Node.js Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Check Application Syntax
        run: node --check app.js

  docker:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t nodejs-github-actions:${{ github.sha }} \
            -t nodejs-github-actions:latest \
            .

      - name: Verify Docker Image
        run: docker images

      - name: Test Container Starts
        run: |
          docker run -d --name test-container -p 3000:3000 nodejs-github-actions:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:3000/
          docker stop test-container
          docker rm test-container

  push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: docker

    # Push images only when code is merged/pushed to main
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image for Docker Hub
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-github-actions:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-github-actions:latest \
            .

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-github-actions:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-github-actions:latest