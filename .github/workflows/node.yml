name: Node.js Docker CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Test Node.js Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t nodejs-github-actions:latest .

      - name: Verify Docker Image
        run: docker images